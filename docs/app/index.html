<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightdesk · live demo</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<style>.demo-banner{background:#EEFF8A;color:#0D0D0D;padding:7px 24px;font:12px 'JetBrains Mono',Consolas,monospace;letter-spacing:.02em;text-align:center}.demo-banner a{color:#0D0D0D}</style>
</head>
<body>
<div class="demo-banner">LIVE DEMO · the agent’s rule engine runs in this page · the full agent runs on a local model on your own machine · <a href="https://github.com/ParasAdlakha/nightdesk">code</a> · <a href="../">project page</a></div>
<div class="announce" id="announce"></div>
<nav class="nav">
  <a class="logo" href="./"><img src="icon.svg" alt=""><span>NIGHTDESK</span></a>
  <div class="nav-right">
    <span class="live" id="live"></span>
    <button class="text" id="reset">Reset</button>
    <button class="outline" id="brief">Send morning brief</button>
    <button class="lime" id="seed">Load overnight inbox</button>
  </div>
</nav>
<header class="hero">
  <h1>Night shift,<br><span class="soft">handled.</span></h1>
  <div class="stats" id="stats"></div>
</header>
<main class="board">
  <aside class="panel inbox">
    <div class="label" id="inbox-label">INBOX</div>
    <ul id="messages"></ul>
  </aside>
  <section class="canvas" id="detail"></section>
  <aside class="panel channel">
    <div class="label" id="channel-label">CHANNEL</div>
    <ul id="feed"></ul>
    <div class="label sub">FOLLOW-UPS</div>
    <ul id="tasks"></ul>
  </aside>
</main>
<script type="module" src="engine.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
